name: mnemosyne
version: 2.5
description: "Clawd Memory compatibility provider for Hermes, backed by the Mnemosyne SQLite engine with vector search, FTS5 hybrid ranking, episodic consolidation, and temporal triples."
author: Abdias J
provides_tools:
  - mnemosyne_remember
  - mnemosyne_recall
  - mnemosyne_stats
  - mnemosyne_triple_add
  - mnemosyne_triple_query
  - mnemosyne_sleep
  - mnemosyne_scratchpad_write
  - mnemosyne_scratchpad_read
  - mnemosyne_scratchpad_clear
  - mnemosyne_invalidate
  - mnemosyne_export
  - mnemosyne_import
  - mnemosyne_update
  - mnemosyne_forget
  - mnemosyne_diagnose
provides_hooks:
  - pre_llm_call
  - on_session_start
  - post_tool_call
dependencies: []
# Provider name stays mnemosyne because Hermes config and plugin discovery use it.
