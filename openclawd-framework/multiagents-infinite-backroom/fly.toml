# fly.toml — Fly.io deployment for CLAWD Multi-Agent Infinite Backroom
# Deploy with: fly deploy

app = "clawd-backrooms"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[http_service.concurrency]
  type = "connections"
  hard_limit = 25
  soft_limit = 10

[[services]]
  protocol = "tcp"
  internal_port = 8000

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

[env]
  DEEPSEEK_MODEL = "deepseek-v4-pro"
  DEEPSEEK_BASE_URL = "https://api.deepseek.com"
  LOG_LEVEL = "info"
  DFLOW_QUOTE_API_URL = "https://d.quote-api.dflow.net"
  DFLOW_MARKETS_API_URL = "https://d.prediction-markets-api.dflow.net"
  CONVEX_URL = "https://giddy-dragon-7.convex.cloud"
  CONVEX_SITE_URL = "https://giddy-dragon-7.convex.site"
  CORS_ORIGINS = "https://backrooms.x402.wtf,https://backroom-3d.fly.dev"

[checks]
  [checks.health]
    type = "http"
    path = "/healthz"
    method = "GET"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[mounts]
  source = "clawd_data"
  destination = "/data"
