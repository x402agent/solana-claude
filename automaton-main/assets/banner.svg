<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lobsterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff4444">
        <animate attributeName="stop-color" values="#ff4444;#ff6b35;#ff4444" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#ff6b35">
        <animate attributeName="stop-color" values="#ff6b35;#ffaa00;#ff6b35" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="50%" style="stop-color:#7b2fff"/>
      <stop offset="100%" style="stop-color:#00d4ff">
        <animate attributeName="stop-color" values="#00d4ff;#ff4444;#00d4ff" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" fill="url(#bg)" rx="12"/>

  <!-- Animated grid lines -->
  <g opacity="0.08">
    <line x1="0" y1="40" x2="900" y2="40" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="0" y1="80" x2="900" y2="80" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="0" y1="120" x2="900" y2="120" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="0" y1="160" x2="900" y2="160" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="150" y1="0" x2="150" y2="200" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="200" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="450" y1="0" x2="450" y2="200" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="200" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="750" y1="0" x2="750" y2="200" stroke="#00d4ff" stroke-width="0.5"/>
  </g>

  <!-- Pulsing orbs -->
  <circle cx="50" cy="100" r="40" fill="#7b2fff" opacity="0.06">
    <animate attributeName="r" values="40;55;40" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.06;0.12;0.06" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="850" cy="100" r="40" fill="#00d4ff" opacity="0.06">
    <animate attributeName="r" values="40;55;40" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.06;0.12;0.06" dur="3.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Lobster emoji animated -->
  <text x="48" y="115" font-size="52" text-anchor="middle" filter="url(#softglow)">
    🦞
    <animateTransform attributeName="transform" type="rotate" values="-5 48 100;5 48 100;-5 48 100" dur="2s" repeatCount="indefinite"/>
  </text>

  <!-- Main title -->
  <text x="460" y="72" font-family="'Courier New', monospace" font-size="36" font-weight="bold"
        fill="url(#textGrad)" text-anchor="middle" filter="url(#glow)" letter-spacing="2">
    CRUSTACEAN AUTOMATION
    <animate attributeName="opacity" values="1;0.85;1" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- Subtitle -->
  <text x="460" y="102" font-family="'Courier New', monospace" font-size="14"
        fill="#00d4ff" text-anchor="middle" opacity="0.9" letter-spacing="3">
    SOVEREIGN  AI  LOBSTER  RUNTIME  ON  SOLANA
  </text>

  <!-- Divider line animated -->
  <line x1="120" y1="114" x2="800" y2="114" stroke="url(#lobsterGrad)" stroke-width="1.5" opacity="0.7">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
  </line>

  <!-- Bottom row of info -->
  <text x="230" y="140" font-family="'Courier New', monospace" font-size="11"
        fill="#ff6b35" text-anchor="middle" opacity="0.9">
    v0.2.0
  </text>
  <text x="350" y="140" font-family="'Courier New', monospace" font-size="11"
        fill="#888" text-anchor="middle">
    |
  </text>
  <text x="460" y="140" font-family="'Courier New', monospace" font-size="11"
        fill="#7b2fff" text-anchor="middle" opacity="0.9">
    clawd-automaton
  </text>
  <text x="570" y="140" font-family="'Courier New', monospace" font-size="11"
        fill="#888" text-anchor="middle">
    |
  </text>
  <text x="690" y="140" font-family="'Courier New', monospace" font-size="11"
        fill="#00d4ff" text-anchor="middle" opacity="0.9">
    x402.wtf/automation
  </text>

  <!-- Token address -->
  <text x="460" y="168" font-family="'Courier New', monospace" font-size="10"
        fill="#444" text-anchor="middle" letter-spacing="1">
    $CLAWD · 8cHzQHUS2s2h8TzCmfqPKYiM4dSt4roa3n7MyRLApump
  </text>

  <!-- Tagline -->
  <text x="460" y="188" font-family="'Courier New', monospace" font-size="10"
        fill="#333" text-anchor="middle" font-style="italic">
    The shell molts. The laws do not.
    <animate attributeName="fill" values="#333;#555;#333" dur="5s" repeatCount="indefinite"/>
  </text>

  <!-- Animated scan line -->
  <rect x="0" y="0" width="900" height="3" fill="url(#textGrad)" opacity="0.15" rx="1">
    <animateTransform attributeName="transform" type="translate" values="0,0;0,197;0,0" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.15;0.3;0.15" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- Border glow -->
  <rect x="1" y="1" width="898" height="198" fill="none" stroke="url(#lobsterGrad)" stroke-width="1.5" rx="11" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.7;0.4" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
