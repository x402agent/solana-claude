[package]
name = "clawd-protocol"
version = "0.1.0"
description = "OpenClawd Protocol — adaptive bonding curves, intelligent vaults, agent-token bindings"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "clawd_protocol"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { workspace = true }
anchor-spl = { workspace = true }
bytemuck = { workspace = true }
