# fly.toml for the Clawd LiveKit Voice Agent
# Deploys the Python agent that registers with LiveKit Cloud as CA_xk8hpixq4g6K
app = 'clawd-livekit-agent'

primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  strategy = 'immediate'

[env]
  PYTHONUNBUFFERED = '1'

[http_service]
  internal_port = 59245
  force_https = false
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
