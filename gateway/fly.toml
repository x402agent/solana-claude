app = "clawd-agent-gateway"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"
  context = ".."

[env]
  GATEWAY_PORT = "8080"
  GATEWAY_BASE_URL = "https://clawd-agent-gateway.fly.dev"
  SOLANA_DEVNET_RPC_URL = "https://api.devnet.solana.com"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
