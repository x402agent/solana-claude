<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">OpenClawd AMM Perps Aggregator</title>
  <desc id="desc">Animated AMM and perps routing banner for Clawd.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#05060d"/>
      <stop offset="35%" stop-color="#101827"/>
      <stop offset="68%" stop-color="#24103b"/>
      <stop offset="100%" stop-color="#06281f"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" x2="1">
      <stop offset="0%" stop-color="#14f195"/>
      <stop offset="48%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#ff5f1f"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; }
      .dash { stroke-dasharray: 18 18; animation: dash 7s linear infinite; }
      .float { animation: float 4s ease-in-out infinite; }
      .float2 { animation: float 4.8s ease-in-out infinite reverse; }
      .blink { animation: blink 1.2s steps(2) infinite; }
      @keyframes dash { to { stroke-dashoffset: -216; } }
      @keyframes pulse { 0%,100% { opacity: .58; transform: scale(.985); } 50% { opacity: 1; transform: scale(1.015); } }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
      @keyframes blink { 0%,48% { opacity: 1; } 49%,100% { opacity: .28; } }
    </style>
  </defs>

  <rect width="1200" height="360" rx="26" fill="url(#bg)"/>
  <rect x="18" y="18" width="1164" height="324" rx="22" fill="none" stroke="#25364a" stroke-width="2"/>
  <path class="dash" d="M86 254 C240 118 342 306 500 170 S770 216 924 112 S1056 190 1130 126" fill="none" stroke="url(#rail)" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M86 254 C240 118 342 306 500 170 S770 216 924 112 S1056 190 1130 126" fill="none" stroke="#ffffff" stroke-opacity=".14" stroke-width="18" stroke-linecap="round"/>

  <g class="float" filter="url(#glow)">
    <rect x="88" y="70" width="188" height="72" rx="14" fill="#0f1b2a" stroke="#14f195" stroke-width="2"/>
    <text x="182" y="101" text-anchor="middle" class="mono" fill="#14f195" font-size="18" font-weight="800">PHOENIX</text>
    <text x="182" y="125" text-anchor="middle" class="mono" fill="#d7fff0" font-size="12">book VWAP</text>
  </g>

  <g class="float2" filter="url(#glow)">
    <rect x="340" y="222" width="188" height="72" rx="14" fill="#171329" stroke="#ffd166" stroke-width="2"/>
    <text x="434" y="253" text-anchor="middle" class="mono" fill="#ffd166" font-size="18" font-weight="800">JUPITER</text>
    <text x="434" y="277" text-anchor="middle" class="mono" fill="#fff4d2" font-size="12">AMM impact</text>
  </g>

  <g class="float" filter="url(#glow)">
    <rect x="648" y="78" width="188" height="72" rx="14" fill="#1c1122" stroke="#ff5f1f" stroke-width="2"/>
    <text x="742" y="109" text-anchor="middle" class="mono" fill="#ffb088" font-size="18" font-weight="800">FLASH</text>
    <text x="742" y="133" text-anchor="middle" class="mono" fill="#ffe3d6" font-size="12">funding edge</text>
  </g>

  <g class="float2" filter="url(#glow)">
    <rect x="908" y="208" width="188" height="72" rx="14" fill="#111c26" stroke="#9945ff" stroke-width="2"/>
    <text x="1002" y="239" text-anchor="middle" class="mono" fill="#c5a5ff" font-size="18" font-weight="800">GMTRADE</text>
    <text x="1002" y="263" text-anchor="middle" class="mono" fill="#eee5ff" font-size="12">liquidity lane</text>
  </g>

  <g filter="url(#glow)">
    <circle class="pulse" cx="600" cy="180" r="68" fill="#0d1117" stroke="url(#rail)" stroke-width="5"/>
    <text x="600" y="164" text-anchor="middle" class="sans" fill="#ffffff" font-size="38" font-weight="900">CLAWD</text>
    <text x="600" y="195" text-anchor="middle" class="mono" fill="#14f195" font-size="15" font-weight="800">SMART ROUTER</text>
    <text x="600" y="218" text-anchor="middle" class="mono blink" fill="#ffd166" font-size="12">paper first / live gated</text>
  </g>

  <text x="60" y="326" class="mono" fill="#93a4b8" font-size="13">fees + slippage + liquidity + open interest + funding + confidence</text>
  <text x="1140" y="326" text-anchor="end" class="mono" fill="#93a4b8" font-size="13">15 MCP tools · SDK · CLI</text>
</svg>
