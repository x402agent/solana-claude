version: 2
updates:
  # ── Core solana-clawd (npm/package-lock.json) ──
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    allow:
      - dependency-type: "direct"

  # ── MCP server (npm/package-lock.json) ──
  - package-ecosystem: "npm"
    directory: "/mcp"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  # ── Clawd Router (npm/package-lock.json) ──
  - package-ecosystem: "npm"
    directory: "/clawdrouter"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  # ── Gateway (npm/package-lock.json) ──
  - package-ecosystem: "npm"
    directory: "/gateway"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  # ── Agent Wallet (npm/package-lock.json) ──
  - package-ecosystem: "npm"
    directory: "/packages/agentwallet"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  # ── Beepboop Worker (npm/package-lock.json) ──
  - package-ecosystem: "npm"
    directory: "/beepboop/worker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  # ── Email Worker (npm/package-lock.json) ──
  - package-ecosystem: "npm"
    directory: "/email-worker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  # ── LLM Wiki Tang Web (npm/package-lock.json) ──
  - package-ecosystem: "npm"
    directory: "/llm-wiki-tang/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  # ── Agent Store Storefront (npm/package-lock.json) ──
  - package-ecosystem: "npm"
    directory: "/payments/agent-store/storefront"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  # ── Pay Main PDB (pnpm/pnpm-lock.yaml) ──
  - package-ecosystem: "npm"
    directory: "/payments/pay-main/pdb"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  # ── Pay Main TypeScript (pnpm/pnpm-lock.yaml) ──
  - package-ecosystem: "npm"
    directory: "/payments/pay-main/typescript"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  # ── Rust workspace: Solana programs (Cargo.lock) ──
  - package-ecosystem: "cargo"
    directory: "/programs"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "rust"

  # ── PyPI: LLM Wiki Tang API (requirements.txt) ──
  - package-ecosystem: "pip"
    directory: "/llm-wiki-tang/api"
